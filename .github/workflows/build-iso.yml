name: Bygg ISO

# ISO:n (~1,5 GB) publiceras som release-fil: releaser räknas inte mot
# lagringskvoten för artefakter och tillåter filer upp till 2 GB.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    # Varje måndag, så att den inbakade Claude Code-versionen hålls färsk
    # (auto-uppdatering är avstängd i livemiljön).
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: false

env:
  KEEP_AUTOMATIC_RELEASES: 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # mkarchiso behöver ~10 GB; rensa förinstallerade SDK:er för marginal
      - name: Frigör diskutrymme
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Bygg ISO
        run: ./build.sh

      - name: Checksumma
        id: info
        run: |
          cd out
          iso=$(ls *.iso)
          sha256sum "$iso" > "$iso.sha256"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "claude=$(cat claude-code-version.txt)" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicera release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          ISO: ${{ steps.info.outputs.iso }}
          CLAUDE_VERSION: ${{ steps.info.outputs.claude }}
        run: |
          cat > notes.md <<EOF
          Claude Code **$CLAUDE_VERSION** · byggd från ${GITHUB_SHA::7} · [byggloggen]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          Lägg \`$ISO\` på en Ventoy-USB eller skriv den med \`dd\`. Se README för flödet vid start.
          EOF
          gh release create "$TAG" "out/$ISO" "out/$ISO.sha256" \
            --target "$GITHUB_SHA" \
            --title "Claude Debug ISO $TAG" \
            --notes-file notes.md

      - name: Rensa gamla automatiska byggen
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"build-\"))] | sort_by(.createdAt) | reverse | .[${KEEP_AUTOMATIC_RELEASES}:] | .[].tagName" |
          while read -r tag; do
            echo "Tar bort $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
